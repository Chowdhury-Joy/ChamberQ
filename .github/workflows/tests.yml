name: Tests

on:
  push:
    branches: [main, master, Solo-Doc-V1]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (sqlite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Lockfile resolves Symfony 8.1 which requires PHP >= 8.4.1
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  # Production runs MySQL; local dev and the job above run SQLite. SQLite does
  # not resolve foreign-key targets at CREATE time, has no ONLY_FULL_GROUP_BY,
  # accepts a datetime in a date column, and serialises every write so row
  # locks are never contended. Three migrations were unrunnable on MySQL for
  # months because nothing here ever tried. This job is what stops that
  # happening again — do not remove it to make CI faster.
  phpunit-mysql:
    name: PHPUnit (mysql)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: soldoc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, mysqli, bcmath, gd, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Assert MySQL is running with the strict default sql_mode
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: soldoc_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          mysql -h 127.0.0.1 -u root -e "SELECT VERSION(), @@sql_mode;"

      # Migrations are run as their own step so a schema failure is reported as
      # a schema failure, not buried in a wall of red tests.
      - name: Run migrations on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: soldoc_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate:fresh --seed --no-interaction

      - name: Assert down migrations are reversible
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: soldoc_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php artisan migrate:reset --no-interaction
          php artisan migrate --no-interaction

      # Proves the gate can actually pass on a production-shaped config. A
      # deploy runs the same command without --strict; if this step ever fails,
      # the checklist has drifted from what a real deployment can satisfy and
      # someone will be tempted to skip it.
      - name: Assert the production readiness gate can pass
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_URL: https://chamberq.example
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: soldoc_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          MAIL_MAILER: smtp
          SMS_DRIVER: http
          FILESYSTEM_DISK: s3
          SESSION_SECURE_COOKIE: 'true'
        run: php artisan app:production-check --strict

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: soldoc_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test

  architecture-sync:
    name: Architecture doc sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require architecture.md when files are added, deleted, or renamed
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}"

          STRUCTURAL=$(git diff --name-status "$BASE...HEAD" -- \
            app routes config database resources/views public \
            | grep -E '^[ADR]' || true)

          if [ -z "$STRUCTURAL" ]; then
            echo "No files added, deleted, or renamed — architecture.md update not required."
            exit 0
          fi

          echo "Structural changes detected:"
          echo "$STRUCTURAL"

          if git diff --name-only "$BASE...HEAD" | grep -qx 'architecture.md'; then
            echo "architecture.md was updated. OK."
            exit 0
          fi

          echo ""
          echo "::error::Files were added, deleted, or renamed but architecture.md was not updated."
          echo "See AGENTS.md section 4.1 (Trigger A). Update architecture.md and append one dated"
          echo "line to architecture_history.md. There is no exemption for bug fixes or styling."
          exit 1
