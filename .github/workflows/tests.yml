name: Tests

on:
  push:
    branches: [main, master, Solo-Doc-V1]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Lockfile resolves Symfony 8.1 which requires PHP >= 8.4.1
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
